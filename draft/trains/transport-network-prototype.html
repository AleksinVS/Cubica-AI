<!doctype html>
<!-- Автономный стол CMT: карта занимает рабочую область; действия показываются
     только на нужном этапе. Модель и тестовые данные не зависят от оформления. -->
<html lang="ru">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#20352d" /><title>CMT — игровой стол</title>
<link rel="stylesheet" href="transport-network-prototype.css" />
</head>
<body>
<div class="application-shell">
<main class="game-layout">
<section class="map-panel" aria-label="Карта Гвиней">
<div id="map-viewport" class="map-viewport" tabindex="0" aria-label="Карта: нажмите станцию; перетаскивайте фон; колесо меняет масштаб.">
<div id="map-stage" class="map-stage"><img class="map-image" src="Начальная транспортная сеть.png" alt="Карта регионов Гвинеи" draggable="false" /><svg id="annotation-layer" class="annotation-layer" viewBox="0 0 1878 1345" aria-label="Станции, вагоны и маршруты"></svg></div>
</div>
<div class="map-toolbar" aria-label="Управление картой">
<button id="zoom-out" aria-label="Уменьшить карту" title="Уменьшить">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="Увеличить карту" title="Увеличить">+</button>
<button id="fit-map" aria-label="Показать всю карту" title="Вся карта">⤢</button><button id="focus-map" title="Вернуться к выбранной станции">К станции</button>
</div>
<div class="map-route-caption" id="route-caption" role="status" hidden></div>
<div class="map-legend" id="map-legend" hidden><span><i class="legend-line active"></i>Действует</span><span><i class="legend-line planned"></i>Проект</span><span><i class="legend-line building"></i>Строится</span></div>
<section class="results-panel" id="results-panel" aria-labelledby="results-title" hidden></section>
<section class="station-dock" id="station-dock" aria-labelledby="dock-title" hidden><div id="dock-heading"></div><div id="station-stock" class="station-stock"></div></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</section>
<aside class="sidebar" id="game-sidebar" aria-label="Текущий этап и действия">
<header class="sidebar-header"><button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar-expanded" aria-label="Свернуть сайдбар" title="Свернуть сайдбар">›</button></header>
<div class="sidebar-scroll" id="sidebar-scroll">
<div id="sidebar-expanded">
<div id="phase-inspector"></div>
<section id="teams-section" class="teams-section" aria-label="Команды"><div id="team-table"></div></section>
<div id="context-panel"></div>
</div>
<div id="sidebar-compact" aria-label="Краткая сводка этапа" hidden></div>
</div>
<footer class="round-footer"><button class="next-button" id="next-phase"><span class="next-label">Дальше</span><span class="next-icon" aria-hidden="true">→</span></button></footer>
</aside>
</main>
</div>
<script src="cmt-prototype-fixtures.js"></script><script src="cmt-prototype-model.js"></script><script src="transport-network-prototype.js"></script>
</body></html>
