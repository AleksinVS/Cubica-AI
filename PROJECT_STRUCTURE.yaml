    brainstorming: directory... # Точный неактивный снимок brainstorming, сохранённый для заимствования отдельных практик без импорта методологии Superpowers.
skills: # Единый канонический каталог проектных навыков для всех агентов; Codex использует только символические ссылки из .codex/skills/.
  C_codex-agent-routing: # Внутренний навык маршрутизации Codex-субагентов по сложности, цене ошибки и достаточному контексту.
    agents: directory... # Метаданные отображения внутреннего навыка маршрутизации в интерфейсах Codex.
    scripts: directory... # Детерминированная проверка проектной конфигурации и профилей маршрутизации Codex.
  C_cubica: directory... # Явно включаемый пользователем проектный навык автономной разработки Cubica по ADR-068: утверждаемый общий TSK-план, оркестрация субагентов и приемка результата.
  C_external-skill-adapter: directory... # Проектный навык управляемой адаптации внешних навыков по ADR-069 с детерминированными проверками и семантическим решением агента.
  C_low-memory-host-operations: directory... # Проектный навык безопасных последовательных сборок, тестов и восстановления Cubica на общем хосте с ограниченной оперативной памятью.
  C_ui-compare: # Внутренний навык измеряемого сравнения реализованного интерфейса с визуальным образцом.
    schemas: directory... # JSON Schema contracts for validated UI inventories and reproducible visual-comparison profiles used by C_ui-compare and C_ui-from-mockup.
    scripts: directory... # Command-line image, browser, inventory, profile, accessibility, and comparison checks used by the C_ui-compare workflow.
    tests: directory... # Deterministic regression tests for the C_ui-compare command-line gates, schemas, profiles, adaptive scanning, and browser audit.
  C_ui-from-mockup: # Внутренний навык разработки интерфейса по изображению-макету с инвентаризацией и измеряемой приемкой.
    references: directory... # Проектные руководства, загружаемые ui-from-mockup только для соответствующего масштаба, режима или проверки качества.
    schemas: directory... # JSON Schema временного reference brief, отделяющего наблюдаемое изображение от выводов агента и решений PM.
    scripts: directory... # Детерминированная проверка reference brief и связанных контрольных сумм до реализации UI.
    tests: directory... # Регрессионные тесты схемы и смысловых границ reference brief.
  debugging-and-error-recovery: directory... # Адаптированный для Cubica навык системной диагностики и исправления ошибок из agent-skills.
  verification-before-completion: directory... # Адаптированный для Cubica навык доказательной проверки перед заявлениями о завершении из superpowers.
