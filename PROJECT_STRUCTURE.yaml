  agent-skills: # Неактивные кандидаты из репозитория addyosmani/agent-skills.
    frontend-ui-engineering: directory... # Точный неактивный снимок внешнего навыка frontend-ui-engineering и необходимой ему справки по доступности.
  anthropic-skills: # Неактивные кандидаты из репозитория anthropics/skills.
    frontend-design: directory... # Точный неактивный снимок внешнего навыка frontend-design с исходной лицензией.
