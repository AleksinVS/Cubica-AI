      TSK-20260713-project-knowledge-system.md: file # План внедрения проектной вики Cubica, wiki-графа, FTS5 и векторного поиска, а также производного контекста модулей, символов, вызовов и контрактов.
      TSK-20260717-code-architecture-conformance-review.md: file # План блочного ревью кода на незарегистрированные противоречия с принятой архитектурой, явные ошибки и неоптимальные решения; 16 блоков для оркестратора Opus 4.8 с субагентами.
      TSK-20260719-antarctica-alignment.md: file # План выравнивания Antarctica: измеренный UI-паритет с эталоном, сверка с целевой архитектурой и эталонной логикой монолита, реестры разрывов и исправления через authoring-источники.
      TSK-20260719-antarctica-remediation.md: file # Волна устранения архитектурных разрывов Antarctica по решениям PM: критический дефект интро, эталоны draft, канал game-owned стилей (ADR-091), миграция ассетов ADR-063, вход без gameId, гигиена структуры, манифестные хвосты; волна 2 — дельты метрик в событиях (ADR-092), навигация стрелками и design-time раскладка (ADR-093), восстановление эталонной логики и текстов.
      TSK-20260720-card-face-flip.md: file # Переворот игровых карточек лицом и рубашкой как общая возможность отрисовки, а не приём одной игры.
      TSK-20260722-adr-boundary-cleanup.md: file # План очистки архитектурных решений от игровых данных, исполнительских планов и отчётов реализации без изменения принятых границ платформы.
      TSK-20260726-cmt-region-partition.md: file # Разбиение авторской карты «Карты, деньги, поезда» на игровые области, включая вырезание непроходимой местности и общую посадку разбиения на сетку хранения.
      TSK-20260726-source-materials-governance.md: file # Место хранения авторских первоисточников игр: каталог draft непригоден для промышленной среды, требуется архитектурное решение.
      TSK-20260727-author-material-intake-contract.md: file # Проработка общего контракта приёма авторских материалов игры: границы шага машины и шага человека, состав переиспользуемых инструментов.
      TSK-20260730-test-execution-optimization.md: file # План ускорения локальных и CI-проверок за счёт устранения повторной работы, ступенчатого запуска, профильного E2E и консервативного выбора затронутой области без снижения обязательных гарантий.
      TSK-20260801-cmt-mock-session-availability.md: file # Разбор единственного постоянного падения полной макетной партии: доступность действия ожидается сценарием, но не выдаётся runtime.
      TSK-20260801-cmt-test-suite-cost.md: file # Стоимость и устойчивость наборов проверок игры «Карты, деньги, поезда»: измеренная цена, устранение повторной работы и проверка на закреплённую случайность.
      TSK-20260803-portal-access-control.md: file # Восстановление контроля доступа в черновом контуре портала: проверка владельца заказа, закрытие свободной смены статуса, права ролей на стандартные маршруты и гигиена браузерного кода.
    archive: directory... # Архив задач: старая иерархия milestones/epics/features/content-packs и завершенные TSK-файлы после внедрения новой системы. Содержимое не публикуется в PROJECT_STRUCTURE.yaml; описания ниже — метаданные для governance-проверок задач.
    artifacts: directory... # Постоянные артефакты рабочих задач. Для каждой задачи используется подкаталог с идентификатором задачи.
    AGENTS.md: file # Обязательные локальные правила подготовки исполнительской документации, выбора субагентов и заключительной проверки планов на упрощение.
    README.md: file # Правила текущей системы задач, планов и передачи артефактов.
    ROADMAP.md: file # Историческая дорожная карта старой системы планирования; не используется как текущая доска.
    STRATEGY.md: file # Стратегический слой планирования: горизонты, стратегические темы и правила приоритизации.
draft: # Черновые материалы, эксперименты и прототипы; в карту структуры публикуются только явно описанные элементы (разовые отладочные файлы в корне — LEGACY-0073).
  Antarctica: directory... # Current Antarctica mechanics/scenario extraction source during migration.
  game-player-nextjs: directory... # Единственный UI-эталон игры Antarctica (вложенный git-репозиторий, commit 04a2be6): самодостаточный Next.js-прототип плеера без SDK-зависимостей; источник истины стилей и экранных состояний (S1, подсказка, журнал, leftsidebar) при сверке apps/player-web.
  trains: # Авторские исходные материалы игры «Карты, деньги, поезда», полученные от автора и правообладателя. Это первоисточники, из которых выводятся все производные артефакты игры; сами файлы неизменяемы. Производные результаты распознавания и векторизации хранятся отдельно в подкаталоге «Игровая Карта — векторизация», а проверяемые аннотации — в games/cards-money-trains/annotations.
    Игровая Карта — векторизация: directory... # Более ранние производные результаты распознавания и векторизации границ областей (SVG-сетки и контрольные PNG). Исторический материал предыдущих попыток замыкания сетки; текущим источником истины не является.
    presentation.pptx: file # Авторская презентация игры. Вспомогательный материал по замыслу и оформлению.
    Игровая Карта.png: file # Растровая карта 5079x3627 без нанесённой транспортной сети. Задаёт канонические координаты (canonical-map-pixels), в которых работают все отчёты по карте; привязка векторного слоя к этой системе выполнена аффинным преобразованием с ошибкой около 0.44 px.
    Инструкция КДП — исправленная.pdf: file # Авторские правила игры в исправленной редакции. Первоисточник игровых механик.
    Карта Гвиней  а4.ai: file # Первоисточник геометрии карты (файл формата PDF 1.6). Содержит растровую подложку 17717x11812 CMYK и векторный слой поверх неё: около 1004 обводок — границы областей, и 225 заливок. Из этого файла извлечены 978 путей-кандидатов границ; его sha256 зафиксирован в поле provenance.source отчёта vector-map.polygonization.review.json и в реестре происхождения games/cards-money-trains/asset-provenance.json. Права на публикацию производных подтверждены PM 2026-07-26.
    Карта Гвиней  а4.pdf: file # Экспорт того же авторского файла карты в PDF. Вспомогательная копия для просмотра; в качестве источника геометрии используется .ai.
    Колоди + Новости.xlsx: file # Авторские колоды карт и новостей в табличном виде. Первоисточник содержимого колод и новостных событий.
    Копия Сценарий Карты Деньги Поезда 040225.docx: file # Авторский сценарий ведения игры от 04.02.2025. Первоисточник последовательности этапов сессии.
    Копия Сценарий Карты Деньги Поезда 040225.pdf: file # PDF-версия авторского сценария для чтения и цитирования.
    Начальная транспортная сеть CROP.jpg: file # Обрезанный фрагмент карты с начальной транспортной сетью; вспомогательный материал для сверки.
    Начальная транспортная сеть.png: file # Растровая карта 5079x3627 с нанесённой начальной транспортной сетью. Источник поставляемого игрового фона assets/images/guinea-map.webp; sha256 и подтверждённые права зафиксированы в games/cards-money-trains/asset-provenance.json.
    Описания стран Гвинеи 1 стол.docx: file # Авторские описания стран Гвинеи для первого стола. Первоисточник страновых текстов и стартовых условий.
    Описания стран Гвинеи 1 стол.pdf: file # PDF-версия авторских описаний стран.
games: # Пакеты игр и связанные ресурсы 
  ai-driven-choice: # Minimal AI-driven fixture used to prove the runtime Agent Turn path without game-specific runtime branches.
    authoring: # Editable ADR-030 authoring manifests for the ai-driven-choice fixture. Runtime manifests are generated from these files and should not be edited directly.
      game.authoring.json: file # Authoring source for the generated ai-driven-choice game manifest.
  antarctica: # Пакет игры «Antarctica» (канонический content layer)
    assets: directory... # Ассеты игры Antarctica для канала ADR-063 (изображения, реестр assets.json, 41 запись). TSK-20260719 R4b: рендерер резолвит asset:<id> для screenComponent/gameVariableComponent/imageComponent-свойств и для themeBackgroundImage плагина; фон, шаблон info-иллюстраций и left-sidebar/top-sidebar-бейджи метрик переведены на asset:<id>. TSK-20260719 R7: metric_specs (подписи/алиасы/asset:<id> изображения топбара и левого сайдбара) добавлены в games/antarctica/authoring/ui/web.authoring.json; плагинный словарь metricBackgroundImages сведён к пустому объекту — топбар-бейджи резолвятся напрямую через собственный asset:<id> каждого gameVariableComponent. LEGACY-0023 закрыт.
    authoring: directory... # Authoring manifests for Antarctica game and UI channels. These are the editable source files that compile into runtime game.manifest.json and ui.manifest.json via the ADR-030 authoring compiler.
    design: directory... # Design-артефакты Antarctica: макеты (mockups) и design.json-описания экранов, читаются runtime-api и UI-манифестом.
    plugins: directory... # Project-local plugins for the Antarctica game. These plugins belong to the game project, not to the shared platform apps.
    ui: directory... # Скомпилированные UI-манифесты Antarctica по каналам доставки (генераты из authoring/ui, руками не править).
  cards-money-trains: # Game-owned package for the facilitated business game «Карты, деньги, поезда». It contains authoring/runtime manifests, bounded fixtures, delivery assets, the player-web board plugin, and root-level asset-provenance.json — a provenance registry (list of records, validated against the platform schema docs/architecture/schemas/asset-provenance.schema.json) covering both delivered assets and author source materials, with source hashes, conversion details, and publication-rights status per record.
    annotations: directory... # Проверяемые аннотации авторской карты: координаты, транспортная сеть и будущие контуры областей до их контролируемой публикации в runtime-манифесте.
    assets: directory... # Game-owned delivery assets use the normative ADR-063 assets.json registry. Governance metadata is intentionally stored outside this delivery directory in the game-root asset-provenance.json file.
    authoring: directory... # Editable source manifests and confirmed game-owned configuration. Generated runtime and UI manifests are compiled from this directory.
    plugins: directory... # Project-local trusted plugins owned by «Карты, деньги, поезда».
    published: directory... # Immutable content-addressed player-web plugin bundles generated from the game-owned project-local plugin.
    tools: directory... # Воспроизводимые инструменты приёма и сборки авторского содержимого игры без ручного редактирования производных манифестов.
    ui: directory... # Generated channel-specific UI manifests for «Карты, деньги, поезда».
  cards-money-trains-mock: # Отдельный запускаемый тестовый пакет игры «Карты, деньги, поезда». Он содержит только вымышленные данные и не заменяет нормативный пакет cards-money-trains.
    annotations: directory... # Шаблоны и проверяемые игровые аннотации для переноса транспортной сети с изображения в декларативные данные манифеста; общий контракт хранится в docs/architecture/schemas.
    assets: directory... # Реестр ресурсов mock-пакета: для запуска используется локальная копия разрешённой авторской карты, а тестовая топология и содержимое остаются явно ненормативными.
    authoring: directory... # Собираемые исходники исполнимых game/UI-манифестов тестовой копии; все содержимое явно помечено MOCK.
    fixtures: # Вымышленные команды, грузы, выплаты и контрольный сценарий, используемые только для продолжения разработки до ответа автора.
      complete-session-transcript.json: file # Статичный 88-шаговый mock-транскрипт полного фасилитируемого сеанса с двумя контрольными перезапусками и семью атомарными отказами.
      control-transcript.json: file # Короткий контрольный сценарий базового игрового цикла, сохранённый отдельно от полной партии.
      mock-gameplay-data.json: file # Вымышленные команды, колоды, техника, цены и методические точки test-only игры.
    generated: directory... # Проверенные производные данные карты; пересобираются из JSON-аннотации и не редактируются вручную.
    plugins: directory... # Локальные доверенные плагины отдельного mock-пакета игры «Карты, деньги, поезда».
    tests: directory... # Узкие проверки целостности mock-пакета, преобразования карты и отделения тестовых данных от нормативной игры.
    tools: directory... # Локальные инструменты тестового пакета: проверка аннотаций карты, преобразование в фрагмент манифеста и сборка запускаемой mock-копии.
    ui: directory... # Собранные UI-манифесты тестового игрового пакета.
  estate-race: # Оригинальная пошаговая экономическая игра Estate Race и её изолированные игровые манифесты, интерфейс и подключаемый модуль поля. Первый срез доказывает бросок костей, владение участком и выплату ренты без заимствования названий или оформления Monopoly.
    authoring: directory... # Редактируемые исходные манифесты Estate Race, из которых компилятор создаёт runtime- и web-манифесты вместе с картами источников.
    plugins: directory... # Подключаемые клиентские модули Estate Race; игровое состояние и правила остаются в манифесте и Runtime API.
    published: directory... # Неизменяемый собранный клиентский модуль Estate Race и реестр его адресуемой по содержимому версии.
    tests: directory... # Сквозные runtime-проверки первого игрового среза Estate Race с воспроизводимым зерном случайности.
    ui: directory... # Скомпилированные клиентские манифесты Estate Race, сгруппированные по каналам.
  simple-choice: # Minimal game-agnostic fixture used to prove that runtime-api and player-web can run a second game without a custom web plugin.
    assets: directory... # Исходные (SSOT) ассеты игры simple-choice для канала ADR-063/ADR-091: реестр assets.json, изображения и game-owned таблицы стилей.
    authoring: # Editable ADR-030 authoring manifests for the simple-choice pilot. Runtime manifests are generated from these files and should not be edited directly.
      game.authoring.json: file # Authoring source for the generated simple-choice game manifest.
    published: directory... # Неизменяемые, адресуемые по содержимому генераты игры simple-choice: game-owned таблицы стилей (ADR-091) и их реестр game-stylesheets.json. Правятся только конвейером публикации.
    ui: directory... # Generated channel-specific UI manifests for the simple-choice fixture (compiled from authoring/ui, do not edit by hand).
packages: # Переиспользуемые платформенные пакеты (contracts) 
  contracts: # Слой общих контрактов между сервисами 
    ai: directory... # AI task, result, Cubica Surface, Agent Turn, execution-mode and Agent UI boundary contracts owned by Cubica rather than CopilotKit or AG-UI.
    manifest: directory... # Порождаемые из JSON Schema контракты игровых, UI и authoring-манифестов.
    runtime: directory... # Контракты команд, результатов и публичной границы игрового runtime.
    session: directory... # Контракты сессий, участников, событий, квитанций и постоянного состояния.
  editor-engine: directory... # Framework-agnostic editor engine package for ADR-034 authoring manifest editing. It owns JSON document state, neutral graph projection, reverse projection intents, and deterministic diagnostics helpers.
  view-protocol: directory... # Framework-agnostic package with the Abstract View Protocol contracts (ADR-002: Presenter -> View commands) and JSON state patch utilities (RFC 7396 Merge Patch, RFC 6902 JSON Patch). Seed of the future extracted player core per ADR-064.
scripts: # Скрипты разработки и индексирования 
  asset-provenance: directory... # Общая проверка реестра происхождения игры: сверяет реестр с платформенной схемой docs/architecture/schemas/asset-provenance.schema.json и подтверждает, что пути, размеры и отпечатки записей совпадают с файлами на диске. Инструмент не привязан к конкретной игре: она указывается ключом --game.
  ci: # Cross-platform CI validation scripts that enforce repository governance rules before merge.
    profile-command.mjs: file # Compact timing wrapper for local and CI verification commands; writes sanitized duration and exit metadata without command arguments or environment values.
    select-affected-tests.mjs: file # Fail-closed changed-path selector for local verification and observational CI summaries; unknown or critical paths expand to the full safe suite.
    select-affected-tests.test.mjs: file # Deterministic regression tests for affected-test mapping, path normalization and full-fallback safety.
    validate-agent-ui-boundaries.js: file # Node.js validator for ADR-044 Agent UI import boundaries: CopilotKit and AG-UI imports are allowed only in approved adapter files.
    validate-legacy.js: file # Node.js validator for legacy debt rows, stub register consistency, stub marker governance and .desc.json parsing.
    validate-legacy.ps1: file # PowerShell wrapper that delegates legacy/stub validation to the cross-platform Node.js validator.
    validate-manifest-authoring.js: file # Node.js validator for ADR-030 authoring manifest compilation, generated drift and authoring-only key leakage.
    validate-prototype-audit-status.js: file # Node.js validator for ADR-050 prototype audit status records emitted by the weekly audit workflow.
    validate-runtime-api-openapi.js: file # Node.js validator for ADR-051 runtime-api OpenAPI contract shape, endpoint drift and future extraction spec classification.
  debug: directory... # Поддерживаемый клиент ручных Runtime API-команд; одноразовые визуальные расследования заменены проектными навыками сравнения интерфейса.
  manifest-tools: # Manifest transformation and generation tools used by development and CI workflows.
    audit-prototype-candidates.cjs: file # Read-only ADR-050 prototype candidate audit CLI for local, PR, weekly, LLM-semantic and platform promotion backlog workflows.
    compile-authoring-manifests.cjs: file # Compiler for ADR-030 authoring manifests that generates runtime manifests and source map companion files.
    compile-cache.cjs: file # Level-3 compile cache (ADR-057) and hit/miss telemetry: content-hash-keyed, atomic, one-shot .tmp storage that is never a source of truth.
    compile-worker.cjs: file # Worker-thread entry point that compiles one authoring job as a pure function so the compile pool stays byte-identical to a sequential run.
  map-annotation: # Общий schema-first конвейер ручной разметки транспортной сети поверх карты: проверка связей и геометрии, безопасное SVG-наложение и адаптируемая сборка фрагмента манифеста.
    fixtures: directory... # Нейтральные данные и минимальная карта для проверки общего конвейера аннотации без терминов и правил конкретной игры.
    map-annotation.mjs: file # Нейтральный модуль проверки аннотации, визуального наложения и преобразования подтверждённых данных с переданными игрой правилами.
    map-annotation.test.mjs: file # Сфокусированные нейтральные тесты общего формата, review-draft режима и запрета публикации неподтверждённых данных.
  ops: # Operational (ops) scripts for running the platform on a single host until the orchestrator model (LEGACY-0026) is built.
    service-supervisor.mjs: file # Minimal single-host service supervisor (ADR-067): starts, health-checks and restarts the delivery services (runtime-api + player-web) with backoff and graceful group shutdown, as the interim recovery loop. Runbook: docs/processes/service-recovery-runbook.md.
services: # Сервисы и инфраструктура 
  game-catalog: directory... # Заготовка будущего сервиса каталога, лицензий и продуктовой публикации игр.
  game-editor: # Service boundary for the future Cubica game editor. It contains authoring workspace documentation and will host editor-specific implementation when this boundary is activated.
    docs: # Project documentation for Game Editor features, authoring workflows and editor-engine design.
      editor-engine-authoring-manifest-editor.md: file # Design document for the schema-first authoring manifest editor with flow-chart projection, Monaco/JSON editing and floating property panel.
    DEV_GUIDE.md: file # Development guide for the Game Editor service boundary, including current scope, planned editor-engine direction and testing expectations.
  game-engine: directory... # Service boundary for a future game engine service. The current canonical runtime path executes deterministic manifest actions in services/runtime-api.
  game-repository: directory... # Service boundary for a future game repository. The current canonical runtime loads game content through services/runtime-api.
  metadata-db: directory... # Заготовка будущего сервиса метаданных и аналитики игровых сессий.
  portal-backend: # Strapi backend портала для каталога, заказов, покупок, платежной заглушки и launch-session API.
