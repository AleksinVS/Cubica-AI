  <text x="700" y="463" text-anchor="middle" class="serif" font-size="30" font-weight="700">Медная улица</text>
  <text x="700" y="507" text-anchor="middle" class="sans" font-size="18">Цена 160 монет  ·  аренда 24 монеты  ·  владелец не объявлен</text>
  <text x="700" y="546" text-anchor="middle" class="sans" font-size="15">Последний бросок 〔2〕 〔3〕 · сумма 5</text>
