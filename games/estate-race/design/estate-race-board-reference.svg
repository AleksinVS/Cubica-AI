  <text x="700" y="305" text-anchor="middle" class="cap copper" font-size="14">ЭКОНОМИЧЕСКАЯ СТРАТЕГИЯ</text>
  <text x="700" y="350" text-anchor="middle" class="cap" font-size="18" fill="#315d51">ХОД 12  ·  ИГРОК 2  ·  РЕШЕНИЕ О ПОКУПКЕ</text>
  <line x1="370" y1="376" x2="1030" y2="376" stroke="#b56f3c"/>

