<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Estate Race — редакционная настольная карта</title>
  <desc id="desc">Оригинальный референс игрового поля: светлая бумага, глубокий зелёный и один медный акцент. Поле окружает центральный контекст хода и экономику участников.</desc>
